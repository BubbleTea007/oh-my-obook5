; CrossMux OBOOK5 native target.
;
; This project intentionally lives outside crossmux/upstream and
; crossmux/simulator.  A generated src/ tree (prepare.py) links the upstream
; reader sources and the simulator's Arduino/ESP-IDF shims, replacing only the
; display/input/main HAL with crossmux/port/obook5.
;
; Build with ../../toolchain/bin first in PATH so PlatformIO's native
; toolchain resolves to zig cc/c++ for mipsel-linux-musleabi.

[platformio]
default_envs = obook5
src_dir = src

[env:obook5]
platform = native
lib_ldf_mode = deep+
lib_compat_mode = off

build_src_filter =
  +<*>

build_flags =
  -O2
  -static
  -s
  -std=gnu++2a
  -Wno-c++11-narrowing
  -Wno-deprecated-declarations
  -Wno-unused-command-line-argument
  -Wno-date-time
  -Wno-error=date-time
  -D_LIBCPP_DISABLE_AVAILABILITY
  -DSIMULATOR
  -D__LINUX__
  -DSIMULATOR_DEVICE_X4_PRO
  -DCROSSPOINT_EMULATED=1
  -DFREEINK_DEVICE_X4PRO=1
  -DBOARD_HAS_PSRAM
  -DCROSSPOINT_SIMULATOR_PROJECT_WEBSERVER
  -DCROSSPOINT_SIMULATOR_OTA_CHANNELS=1
  -DCROSSPOINT_VERSION=\"obook5-dev\"
  -DENABLE_CHINESE_VERSION=1
  -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -DMAX_WIDTH=3072
  -I$PROJECT_DIR/../linux
  -I$PROJECT_DIR/../../upstream/src
  -I$PROJECT_DIR/../../upstream/lib/JsonParser
  -I$PROJECT_DIR/../../upstream/freeink-sdk/libs/book/ContentProtection/include
  -I$PROJECT_DIR/../shims
  -I$PROJECT_DIR/../../upstream/freeink-sdk/libs/network/BleKeyboardHost/include

build_unflags =
  -std=gnu++11

lib_extra_dirs =
  ../../upstream/lib

lib_ignore =
  hal
  PNGdec
  JPEGDEC
  WebSockets
  SecureNet
  ContentProtection
  wolfssl

lib_deps =
  JsonSax=symlink://../../upstream/freeink-sdk/libs/network/JsonSax
  CatalogList=symlink://../../upstream/freeink-sdk/libs/network/CatalogList
  Opds=symlink://../../upstream/freeink-sdk/libs/network/Opds
  FreeInkUI=symlink://../../upstream/freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://../../upstream/freeink-sdk/libs/assets/Icons
  FreeInkFont=symlink://../../upstream/freeink-sdk/libs/font/FreeInkFont
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  knolleary/PubSubClient @ ^2.8
  https://github.com/bitbank2/AnimatedGIF.git#67cfacafe12ef4926c7713342c57d2a4af040e5e

extra_scripts =
  pre:../../upstream/scripts/patch_animatedgif.py
  pre:exclude_content_protection.py
